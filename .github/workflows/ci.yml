name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality (ruff, ty, schemas)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.13"

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install quality & schema dependencies
        run: >
          uv sync --frozen
          --group dev
          --group typecheck
          --extra all

      - name: Ruff check
        run: uv run -m ruff check src tests

      - name: Ruff format
        run: uv run -m ruff format --check src tests

      - name: Type check (ty)
        run: uv run -m ty check src tests

      - name: Verify LinkML provenance release assets
        run: |
          uv build --out-dir provenance-dist
          unzip -l provenance-dist/consist-*.whl | grep -F "consist/schemas/provenance.yaml"
          unzip -l provenance-dist/consist-*.whl | grep -F "consist/schemas/binding.yaml"
          tar -tzf provenance-dist/consist-*.tar.gz | grep -F "/src/consist/schemas/provenance.yaml"
          tar -tzf provenance-dist/consist-*.tar.gz | grep -F "/src/consist/schemas/binding.yaml"
          uv run python scripts/build_provenance_schema_release.py \
            --output provenance-schema-release
          (cd provenance-schema-release && sha256sum -c SHA256SUMS)

  test:
    name: tests (ubuntu-latest, py3.11, coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_PYTHON: "3.11"

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: >
          uv sync --frozen
          --group dev
          --extra all

      - name: Pytest (skip heavy, coverage)
        run: >
          uv run -m pytest -q
          -m "not heavy"
          tests/unit tests/integration tests/e2e
          --durations=40
          --cov=src/consist
          --cov-report=term
          --cov-report=json:coverage.json
          --cov-fail-under=80

      - name: Coverage Guardrails (Critical Modules)
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("coverage.json").read_text())
          files = data.get("files", {})

          thresholds = {
              "src/consist/core/materialize.py": 70.0,
              "src/consist/integrations/dlt_loader.py": 70.0
          }

          failures = []
          for path, minimum in thresholds.items():
              summary = files.get(path, {}).get("summary")
              if summary is None:
                  failures.append(f"{path}: missing from coverage report")
                  continue
              actual = float(summary.get("percent_covered", 0.0))
              if actual < minimum:
                  failures.append(f"{path}: {actual:.1f}% < {minimum:.1f}%")
              else:
                  print(f"PASS {path}: {actual:.1f}% >= {minimum:.1f}%")

          if failures:
              print("Coverage guardrail failures:")
              for failure in failures:
                  print(f"- {failure}")
              raise SystemExit(1)
          PY

      - name: Coverage Guardrails (CLI)
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("coverage.json").read_text())
          files = report.get("files", {})
          cli_path = "src/consist/cli.py"
          threshold = 80.0

          summary = files.get(cli_path, {}).get("summary")
          if summary is None:
              raise SystemExit(f"{cli_path}: missing from coverage report")

          actual = float(summary.get("percent_covered", 0.0))
          if actual < threshold:
              raise SystemExit(
                  f"{cli_path}: {actual:.1f}% < {threshold:.1f}% (CLI coverage gate)"
              )
          print(f"PASS {cli_path}: {actual:.1f}% >= {threshold:.1f}%")
          PY

      - name: CLI startup benchmark
        run: |
          mkdir -p ci-artifacts
          uv run python scripts/benchmarks/cli_startup_benchmark.py \
            --iterations 8 \
            --warmup 2 \
            --out ci-artifacts/cli-startup-benchmark.json

      - name: Upload CLI startup benchmark
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: cli-startup-benchmark-${{ github.sha }}
          path: ci-artifacts/cli-startup-benchmark.json
          if-no-files-found: error

  smoke:
    name: smoke (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: >
          uv sync --frozen
          --group dev

      - name: Smoke pytest (core tracker, exec, CLI)
        run: >
          uv run -m pytest -q
          tests/unit/core/test_persistence.py
          tests/unit/core/test_tracker_run.py
          tests/unit/core/test_tracker_exec.py
          tests/unit/cli/test_cli.py
          --durations=10
