name: Gated ActivitySim integration

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: gated-activitysim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activitysim-workflow-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install dependencies
        run: uv sync --python 3.12 --frozen --group dev --extra all

      - name: Run gated ActivitySim workflow variants
        run: >
          uv run --python 3.12 -m pytest -q
          -m heavy
          tests/integration/activitysim
          --durations=40
